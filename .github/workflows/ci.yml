name: Integration tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the web app, migrate the database, and wait for readiness
        run: docker compose --env-file .env.example up --build -d --wait
      - name: Run the test suite
        run: docker compose --env-file .env.example exec -T api python -m unittest discover -s tests -v
      - name: Show service logs on failure
        if: failure()
        run: docker compose --env-file .env.example logs --no-color --tail=100
